<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste isolado — Gemini direto do navegador</title>
<style>
  body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:0 16px;line-height:1.6;}
  textarea{width:100%;height:60px;}
  #resultado{white-space:pre-wrap;background:#f1f1f1;padding:12px;border-radius:8px;margin-top:12px;min-height:40px;}
  button{padding:10px 20px;font-size:1rem;cursor:pointer;}
</style>
</head>
<body>
  <h2>Teste isolado: Gemini direto do navegador</h2>
  <p>Esse arquivo é só pra teste — não é o Semeador. Cola sua chave do Gemini (gerada em <a href="https://aistudio.google.com" target="_blank">aistudio.google.com</a>, começa com <code>AIzaSy...</code>) e testa.</p>
  <input type="text" id="key" placeholder="Cola a chave do Gemini aqui (AIzaSy...)" style="width:100%;padding:8px;">
  <br><br>
  <textarea id="pergunta">Explica em 1 frase o que é fé.</textarea>
  <br><br>
  <button onclick="testar()">Testar chamada real</button>
  <div id="resultado">O resultado (ou o erro) aparece aqui.</div>

<script>
async function callGeminiAPI(systemPrompt, userPrompt, key){
  // Modelo atualizado (gemini-1.5-flash está aposentado) + autenticação via header, como a documentação atual recomenda
  const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent`;

  const requestBody = {
    contents: [{
      parts: [{ text: `${systemPrompt}\n\n${userPrompt}` }]
    }]
  };

  const response = await fetch(GEMINI_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-goog-api-key": key
    },
    body: JSON.stringify(requestBody)
  });

  if(!response.ok){
    const erroTexto = await response.text();
    throw new Error(`Erro ${response.status}: ${erroTexto}`);
  }

  const data = await response.json();
  return data.candidates[0].content.parts[0].text;
}

async function testar(){
  const key = document.getElementById('key').value.trim();
  const pergunta = document.getElementById('pergunta').value.trim();
  const resultado = document.getElementById('resultado');

  if(!key){ resultado.textContent = 'Cola a chave primeiro.'; return; }

  resultado.textContent = 'Testando chamada real pro Gemini...';
  try{
    const texto = await callGeminiAPI('Você é um assistente cristão.', pergunta, key);
    resultado.textContent = '✅ FUNCIONOU:\n\n' + texto;
  } catch(e){
    resultado.textContent = '❌ ERRO:\n\n' + e.message + '\n\n(Se o erro mencionar CORS ou "Failed to fetch", é a barreira que expliquei — não é bug de sintaxe, é o Google bloqueando chamada direta do navegador.)';
    console.error(e);
  }
}
</script>
</body>
</html>
